
# [gcode_macro BED_NOZZLE_WIPE]
# # Default parameters for the nozzle wipe macro.
# # These can be overridden when calling the macro (e.g., NOZZLE_WIPE WIGGLES=5)
# variable_x_start: -9      # Starting X coordinate of the wiper area
# variable_y_start: 0     # Starting Y coordinate of the wiper area
# variable_x_end: -3        # Ending X coordinate of the wiper area
# variable_y_end: 20       # Ending Y coordinate of the wiper area
# variable_z_min: 4      # Minimum Z-height for wiping
# variable_z_max: 4      # Maximum Z-height for wiping
# variable_wiggles: 2      # Number of full back-and-forth passes through the wiper (across X-axis)
# variable_y_zigzags_per_x_pass: 2 # Number of Y-axis zig-zags during one full X-axis traversal (e.g., 2 means Y_START->Y_END->Y_START)
# variable_wipe_speed: 80   # Speed (mm/s) for wiping movements (default 50 mm/s)
# variable_z_travel_speed: 50 # Speed (mm/s) for Z-axis travel movements (default 50 mm/s)
# description: Nozzle wiping macro with zig-zag motion.
# gcode:
#    # Assign parameters, using defaults if not provided by the user
#    {% set X_START = params.X_START|default(x_start) %}
#    {% set Y_START = params.Y_START|default(y_start) %}
#    {% set X_END = params.X_END|default(x_end) %}
#    {% set Y_END = params.Y_END|default(y_end) %}
#    {% set Z_MIN = params.Z_MIN|default(z_min) %}
#    {% set Z_MAX = params.Z_MAX|default(z_max) %}
#    {% set WIGGLES = params.WIGGLES|default(wiggles)|int %}
#    {% set Y_ZIGZAGS_PER_X_PASS = params.Y_ZIGZAGS_PER_X_PASS|default(y_zigzags_per_x_pass)|int %}
#    {% set WIPE_SPEED_MM_S = params.WIPE_SPEED|default(wipe_speed)|int %}
#    {% set Z_TRAVEL_SPEED_MM_S = params.Z_TRAVEL_SPEED|default(z_travel_speed)|int %}
#    # Convert speeds from mm/s to mm/min for G-code commands
#    {% set WIPE_SPEED_MM_MIN = WIPE_SPEED_MM_S * 60 %}
#    {% set Z_TRAVEL_SPEED_MM_MIN = Z_TRAVEL_SPEED_MM_S * 60 %}
#    # Ensure Y_ZIGZAGS_PER_X_PASS is at least 1
#    {% if Y_ZIGZAGS_PER_X_PASS < 1 %}
#        {% set Y_ZIGZAGS_PER_X_PASS = 1 %}
#    {% endif %}
#    # Calculate the number of total segments for X movement.
#    # Each full Y-zigzag (e.g., Y_START -> Y_END -> Y_START) involves two diagonal movements.
#    # So, for N zigzags, we need 2N segments to complete the full X traversal.
#    {% set total_x_segments = Y_ZIGZAGS_PER_X_PASS * 2 %}
#    {% set X_SEGMENT_LENGTH = (X_END - X_START) / total_x_segments %}

#    # 1. Check if printer is homed. If not, perform G28.
#    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes or not 'z' in printer.toolhead.homed_axes %}
#        M117 Homing printer...
#        G28 ; Home all axes if not already homed
#    {% endif %}
#    # 2. Save the current G-code state (position, speed, etc.)
#    # This allows the printer to return to its exact previous state after the wipe.
#    SAVE_GCODE_STATE NAME=nozzle_wipe_state
#    # 3. Ensure absolute positioning (G90) for precise coordinate movements
#    G90
#    # 4. Move Z up to a safe height above the wiping area before horizontal travel.
#    # This prevents the nozzle from dragging across the bed or obstacles.
#    G0 Z{Z_MAX + 1.0} F{Z_TRAVEL_SPEED_MM_MIN} ; Move Z up quickly
#    # 5. Perform the wiping motion: Wiggle back and forth through the wiper with multiple zig-zags.
#    # The outer loop iterates 'WIGGLES' times for full back-and-forth passes across the X-axis.
#    M117 Wiping at bed wiper.
#    {% for i in range(WIGGLES) %}
#        # Determine current X direction (forward or backward pass)
#        {% set is_forward_pass = i % 2 == 0 %}
#        # Set initial X and Y for this pass.
#        # We always start at Y_START for the first segment of any X-pass to ensure consistent zig-zag pattern.
#        {% set current_x = X_START if is_forward_pass else X_END %}
#        {% set current_y = Y_START %}
#        # Move to the starting point of the current pass (at safe Z)
#        G0 X{current_x} Y{current_y} F{WIPE_SPEED_MM_MIN * 1.25}
#        # Move down to the minimum Z-height for wiping
#        G0 Z{Z_MIN} F{Z_TRAVEL_SPEED_MM_MIN}
#        # Perform Y-zigzags while traversing X
#        # The inner loop iterates through the calculated number of X segments.
#        {% for j in range(total_x_segments) %}
#            # Calculate target X for this segment.
#            # For forward passes, X increases; for backward, X decreases.
#            {% set target_x_raw = X_START + (j + 1) * X_SEGMENT_LENGTH %}
#            {% set target_x = target_x_raw if is_forward_pass else X_END - (target_x_raw - X_START) %}
#            # Determine target Y for this segment. It alternates between Y_END and Y_START.
#            # This creates the zig-zag motion along the Y-axis.
#            {% set target_y = Y_END if j % 2 == 0 else Y_START %}
#            # Adjust target_x for potential floating point inaccuracies at the very end of the pass.
#            {% if is_forward_pass and j == total_x_segments - 1 %}
#                {% set target_x = X_END %}
#            {% elif not is_forward_pass and j == total_x_segments - 1 %}
#                {% set target_x = X_START %}
#            {% endif %}
#            # Move diagonally to the next zig-zag point
#            G1 X{target_x} Y{target_y} F{WIPE_SPEED_MM_MIN}
#        {% endfor %}
#        # After completing the X-pass, move up to Z-max for the return journey
#        G0 Z{Z_MAX} F{Z_TRAVEL_SPEED_MM_MIN}
#    {% endfor %}
#    # 6. Move Z back to a safe height after the wiping sequence is complete.
#    G0 Z{Z_MAX + 1.0} F{Z_TRAVEL_SPEED_MM_MIN}
#    # 7. Restore the printer's G-code state to what it was before the macro was called.
#    # MOVE=1 ensures the printer physically moves back to the saved position.
#    RESTORE_GCODE_STATE NAME=nozzle_wipe_state MOVE=1 MOVE_SPEED={WIPE_SPEED_MM_S}
#    # 8. Display a message on the printer's display indicating completion.
#    M117 Nozzle wiped!

[gcode_macro CLEAN_NOZZLE_PARK]
gcode:
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
 {% endif %}

  G90

  ## Set this position right above the bucket.
  G1 X-9 Y0 Z5 F6000

[gcode_macro CLEAN_NOZZLE]
variable_start_x: 191
variable_start_y: 224
variable_start_z: 1 ; Set this Z distance so that most of the nozzle is buried in the scrubber.
variable_wipe_dist: 30
variable_wipe_qty: 4
variable_wipe_spd: 200
variable_raise_distance: 5

gcode:
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
   CALIBRATE_Z
 {% endif %}
 
 G90                                            ; absolute positioning

 STATUS_CLEANING
 
 ## Move nozzle to start position
 G1 X{start_x} Y{start_y} F6000
 G1 Z{start_z} F1500

 ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} F{wipe_spd * 60}
   G1 X{start_x} F{wipe_spd * 60}
 {% endfor %}

 ## Raise nozzle
 G1 Y{start_y + 6} Z{raise_distance}