# [gcode_macro PRINT_START]
# gcode:
#   # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
#   {% set target_bed = params.BED|int %}
#   {% set target_extruder = params.EXTRUDER|int %}
#   {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
#   {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

#   # Homes the printer and sets absolute positioning
#   G29                   # Full home (XYZ)
#   G90                   # Absolut position


#   G1 X{x_wait} Y{y_wait} Z15 F9000                # Goes to center of the bed
#   M109 S{target_bed}                              # Sets target temp for the bed                                    
#   M109 S{target_extruder}  

#   SETUP_KAMP_LINE_PURGE PURGE_LENGTH=20
#   SETUP_KAMP_MESHING DISPLAY_PARAMETERS=1 LED_ENABLE=1 PROBE_DOCK_ENABLE=1 ATTACH_MACRO="M401" DETACH_MACRO="M402"
#   SETUP_VORON_PURGE DISPLAY_PARAMETERS=1 ADAPTIVE_ENABLE=1 FLOW_RATE=7. SIZE=12

#     # M104 S{EXTRUDER_TEMP} ; Set Extruder temperature
#     # M190 S{BED_TEMP}
#     # M109 S{EXTRUDER_TEMP} ; Wait for Extruder temperature
#     LINE_PURGE
#     VORON_PURGE

#   # Create a purge line and starts the print
#   G1 X5 Y4 Z0.4 F10000                             # Moves to starting point
#   G1 X115 E20 F1000                                # Purge line

# ================================================================================
# GCode Macro: END_PRINT
# Add END_PRINT in your slicers ending script
# ================================================================================
[gcode_macro END_PRINT]
gcode:
        #Get Printer built volume dimensions
        {% set X_MIN = printer.toolhead.axis_minimum.x|default(10)|float %}
        {% set X_MAX = printer.toolhead.axis_maximum.x|default(100)|float %}
        {% set Y_MAX = printer.toolhead.axis_maximum.y|default(100)|float %}

        #Fix-up extruder
        G91                                            
        G1 E-2 F2700                                    
        G1 E-1.5 Z0.2 F2400                        
        G1 X5 Y5 F6000                               
        G1 Z10                                     
        G90                                        

        #Present print
        G1 Z{printer.toolhead.position.z + 10} F600
        G1 X{X_MIN + 5} Y{Y_MAX - 5} F6000
        M106 S0                                      
        M104 S0                                       
        M140 S0                                 

        #Disable Steppers
        M84 X Y E     