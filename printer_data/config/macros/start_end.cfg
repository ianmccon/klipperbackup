[gcode_macro START_PRINT]
gcode:
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  SETUP_KAMP_LINE_PURGE PURGE_LENGTH=20
  SETUP_KAMP_MESHING DISPLAY_PARAMETERS=1 LED_ENABLE=1 PROBE_DOCK_ENABLE=1 ATTACH_MACRO="M401" DETACH_MACRO="M402"
  SETUP_VORON_PURGE DISPLAY_PARAMETERS=1 ADAPTIVE_ENABLE=1 FLOW_RATE=7. SIZE=12

  G90 ; use absolute coordinates
  M83 ; extruder relative mode
  M140 S{target_bed} ; set final bed temp
  M104 S150 ; set temporary nozzle temp to prevent oozing during homing
  G4 S10 ; allow partial nozzle warmup
  G29 ; home all axis
  G1 Z30 F240
  G1 X20 Y5 F3000
  M104 S{target_extruder}  ; set final nozzle temp
  M190 S{target_bed} ; wait for bed temp to stabilize
  M109 S{target_extruder}  ; wait for nozzle temp to stabilize
  LINE_PURGE
  VORON_PURGE

# ================================================================================
# GCode Macro: START_PRINT
# Add START_PRINT BED_TEMP={bed_temperature} EXTRUDER_TEMP={first_layer_temperature} in your slicers starting script
# START_PRINT EXTRUDER=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer_single]
# ================================================================================

