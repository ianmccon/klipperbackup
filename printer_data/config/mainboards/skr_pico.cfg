[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504450593039621C-if00
restart_method: command
# canbus_uuid: ba4fc8004102

[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
# endstop_pin: ^gpio4
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -14
position_min: -14
position_max: 235
homing_speed: 30
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
diag_pin:^gpio4
driver_SGTHRS: 60
uart_address: 0
run_current: 0.7
stealthchop_threshold: 999999

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
# endstop_pin: ^gpio3
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -9
position_min: -9
position_max: 218
homing_speed: 30

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
diag_pin: ^gpio3
driver_SGTHRS: 60
uart_address: 2
run_current: 0.8
stealthchop_threshold: 999999

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8
# endstop_pin: ^gpio25 # Use for Sextbolt
endstop_pin:probe:z_virtual_endstop #Use for Voron Tap and BLTouch
# position_endstop: 5.055 # Sextbolt
# position_endstop: 0.0
position_max: 250
position_min: -10
homing_speed: 5
second_homing_speed: 5
# homing_retract_dist: 1
# homing_positive: true

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.7
stealthchop_threshold: 999999

[heater_bed]
heater_pin: gpio21
sensor_type: ATC Semitec 104GT-2
sensor_pin: gpio26
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130


[controller_fan case_fan]
pin: gpio20
max_power: 1.0
fan_speed: 1.0
idle_speed: 0.5
idle_timeout: 30
heater: extruder
stepper: stepper_x, stepper_y, stepper_z


[temperature_fan SKR_Pico]
pin: gpio17
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100
target_temp: 55.0             # Target temperature in °C
max_delta: 3.0                # Turn fan on at 58°C, off at 52°C
control: watermark


[temperature_fan Raspberry_Pi]
pin: gpio18                     # Replace with your mainboard's fan PWM pin
sensor_type: temperature_host
min_temp: 10
max_temp: 85
target_temp: 55.0             # Target temperature in °C
max_delta: 3.0                # Turn fan on at 58°C, off at 52°C
control: watermark


[firmware_retraction]
retract_length: 3
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 20
#   The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 10
#   The speed of unretraction, in mm/s. The default is 10 mm/s.



